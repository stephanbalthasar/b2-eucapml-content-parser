name: Build booklet index (manual, fixed paths)

on:
  workflow_dispatch: {}   # manual trigger, no UI inputs

# Principle of least privilege for THIS (public) repo's GITHUB_TOKEN.
# We push to the private repo with your PAT secret (see below).
permissions:
  contents: read

env:
  PRIVATE_REPO:       stephanbalthasar/b2-eucapml-content
  PRIVATE_REPO_REF:   main
  DOCX_PATH:          assets/booklet.docx
  OUTPUT_DIR:         artifacts
  PY_VERSION:         '3.11'
  COMMIT_MESSAGE:     'Update booklet index (manual run)'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout public code repo (this repo)
        uses: actions/checkout@v4

      - name: Checkout private content repo (for input + output)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref:        ${{ env.PRIVATE_REPO_REF }}
          # ⬇️ Reuse your existing fine‑grained PAT secret for this repo.
          #    If your secret name differs, change BOOKLET_REPO_PAT below.
          token:      ${{ secrets.BOOKLET_REPO_PAT }}
          path:       private-repo
          persist-credentials: true   # keep auth for later git push

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else
            pip install python-docx==1.1.0 lxml==5.1.0
          fi

      - name: Ensure output directory exists in private repo
        run: |
          mkdir -p "private-repo/${{ env.OUTPUT_DIR }}"

      - name: Build JSONL (and citation map)
        run: |
          python build_booklet_index.py \
            --input  "private-repo/${{ env.DOCX_PATH }}" \
            --output "private-repo/${{ env.OUTPUT_DIR }}/booklet_index.jsonl" \
            --emit-citation-map "private-repo/${{ env.OUTPUT_DIR }}/citation_map.json"

      - name: Commit & push to private repo (only if there are changes)
        working-directory: private-repo
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "${{ env.COMMIT_MESSAGE }}"
            git push origin "${{ env.PRIVATE_REPO_REF }}"
          fi
